<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18" />
      <stop offset="50%" stop-color="#0b1b36" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners for standard & maskable safe zone -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle tech circuit rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Shield / Assertive Chat Core -->
  <g transform="translate(106, 106)">
    <!-- Main Dialog Bubble / Shield Shape -->
    <path d="M150 20 C70 20 10 75 10 145 C10 190 32 230 70 252 L50 290 L110 270 C123 273 136 275 150 275 C230 275 290 220 290 145 C290 75 230 20 150 20 Z" 
          fill="#0f172a" 
          stroke="url(#shieldGrad)" 
          stroke-width="8" 
          stroke-linejoin="round" />

    <!-- Assertive Upward Arrows & Nodes (Leadership Alignment) -->
    <!-- Upward Arrow 1 -->
    <path d="M110 180 L150 130 L190 180" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M150 130 L150 220" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" />

    <!-- Upward Chevron Accent (Level 2) -->
    <path d="M125 125 L150 90 L175 125" fill="none" stroke="#67e8f9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Dynamic Tech Accent Dots -->
    <circle cx="95" cy="100" r="8" fill="#38bdf8" />
    <circle cx="205" cy="100" r="8" fill="#38bdf8" />
    <circle cx="150" cy="62" r="7" fill="#67e8f9" />
  </g>
</svg>
